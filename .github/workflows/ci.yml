name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install System Dependencies
        run: |
          dnf install -y git gcc pkgconf-pkg-config openssl-devel gtk4-devel libadwaita-devel cargo rust

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test

      - name: Build RPM Package
        run: |
          dnf install -y rpm-build systemd-rpm-macros
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d'"' -f2)
          BUILD_DIR="$(pwd)/build/rpm"
          mkdir -p "${BUILD_DIR}/"{BUILD,RPMS,SOURCES,SPECS,SRPMS} dist
          tar --exclude-vcs --exclude="./target" --exclude="./venv" --exclude="./build" --exclude="./dist" --exclude="./models" \
              --transform "s,^\.,pilot-${VERSION}," -czf "${BUILD_DIR}/SOURCES/pilot-${VERSION}.tar.gz" .
          rpmbuild --define "_topdir ${BUILD_DIR}" -ba pilot.spec
          cp "${BUILD_DIR}/RPMS/"*/*.rpm dist/

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilot-rpm
          path: dist/*.rpm
